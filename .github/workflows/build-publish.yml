name: Build Docker Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "LICENSE"

  pull_request:
    branches:
      - main

  release:
    types:
      - published

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Versions
        id: ver
        run: |
          GOST=$(curl -s https://api.github.com/repos/ginuerzh/gost/releases/latest | jq -r '.tag_name' | sed 's/^v//')

          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/cloudflare.gpg

          echo "deb [signed-by=/usr/share/keyrings/cloudflare.gpg] https://pkg.cloudflareclient.com $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare.list

          sudo apt update

          WARP=$(apt-cache show cloudflare-warp | awk '/^Version:/{print $2}' | head -1 | sed 's/-.*//')

          echo "gost=$GOST" >> $GITHUB_OUTPUT
          echo "warp=$WARP" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64

          build-args: |
            BASE_IMAGE=debian:bookworm-slim
            GOST_VERSION=${{ steps.ver.outputs.gost }}
            WARP_VERSION=${{ steps.ver.outputs.warp }}
            COMMIT_SHA=${{ github.sha }}

          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.warp }}
            ghcr.io/${{ github.repository }}:${{ github.sha }}
